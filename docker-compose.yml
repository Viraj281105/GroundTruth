# One command: docker compose up --build   (or ./run.ps1 docker / ./run.sh docker)
# Web  -> http://localhost:3000     API -> http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: groundtruth
      POSTGRES_DB: groundtruth
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundtruth"]
      interval: 5s
      retries: 10

  # One-shot: brings the schema to head, then exits. --max-jobs 0 means it takes no
  # job, so it never competes with the worker. api and worker start only after it
  # exits 0, so nothing ever serves or claims against unmigrated tables.
  migrate:
    image: groundtruth-backend:local
    pull_policy: never
    command: ["python", "-m", "apps.worker.main", "--migrate", "--max-jobs", "0"]
    healthcheck:
      disable: true
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  # api, worker and migrate share one image, built once, here.
  api:
    image: groundtruth-backend:local
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Accounts and sign-in (docs/security/auth.md). Set AUTH_COOKIE_SECURE=true behind HTTPS.
      AUTH_REQUIRED: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOW_REGISTRATION: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    image: groundtruth-backend:local
    pull_policy: never
    command: ["python", "-m", "apps.worker.main"]
    # The image's HTTP health check is for the API; the worker serves no HTTP.
    healthcheck:
      disable: true
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
