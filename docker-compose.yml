# One command: docker compose up --build   (or ./run.ps1 docker / ./run.sh docker)
# Web  -> http://localhost:3000     API -> http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: groundtruth
      POSTGRES_DB: groundtruth
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundtruth"]
      interval: 5s
      retries: 10

  # api, worker and migrate share one image, built once, here.
  api:
    image: groundtruth-backend:local
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Accounts and sign-in (docs/security/auth.md). Set AUTH_COOKIE_SECURE=true behind HTTPS.
      AUTH_REQUIRED: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOW_REGISTRATION: "true"
      # Prometheus metrics (#50) on an internal port: reachable inside this network only,
      # never published to the host (no `ports:` entry).
      METRICS_BIND_ADDRESS: 0.0.0.0
      API_METRICS_PORT: "9464"
    ports: ["8000:8000"]
    expose: ["9464"]
    # The API must not answer before the schema exists: wait for the one-shot migrate service.
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # One-shot: applies migrations (and, only when SEED_DEMO=true, the demo organizations), then exits.
  # Demo seeding is OFF by default; a real deployment must not ship well-known demo accounts.
  migrate:
    image: groundtruth-backend:local
    pull_policy: never
    # --max-jobs 0: migrate (and seed, if enabled), then exit without taking a job.
    command: ["python", "-m", "apps.worker.main", "--migrate", "--max-jobs", "0"]
    healthcheck:
      disable: true
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_DEMO_PASSWORDS_FILE: ${SEED_DEMO_PASSWORDS_FILE:-}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  worker:
    image: groundtruth-backend:local
    pull_policy: never
    command: ["python", "-m", "apps.worker.main"]
    # The image's HTTP health check is for the API; the worker serves only its internal
    # metrics port (9465).
    healthcheck:
      disable: true
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://groundtruth:groundtruth@postgres/groundtruth
      METRICS_BIND_ADDRESS: 0.0.0.0
      WORKER_METRICS_PORT: "9465"
    expose: ["9465"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"
      # Server-side Origin for state-changing calls; must equal the API's FRONTEND_URL.
      SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:

# A fixed name, so the observability stack (infrastructure/observability) can join this
# network and scrape api:9464 and worker:9465 without either port leaving it.
networks:
  default:
    name: groundtruth
