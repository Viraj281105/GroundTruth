# OPTIONAL. The supported hook is scripts/hooks/pre-commit (DEVELOPMENT.md, section 9): it runs
# the same checks in about 1.3 s. This framework config is kept for anyone who prefers
# `pre-commit install`; measured warm on Windows it takes about 3 s, most of it the framework's
# own start-up, so it misses the two-second budget of #21.
#
# What it must match: CI's `ruff format --check packages tests` and `ruff check packages tests`,
# with the ruff version pinned in packages/groundtruth/pyproject.toml (tests/test_pre_commit_hook.py
# fails if `rev` drifts from that pin). mypy is slow, so it is manual only:
#   pre-commit run mypy --hook-stage manual --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(packages|tests)/
      - id: ruff-format
        files: ^(packages|tests)/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --follow-imports=silent]
        files: ^packages/groundtruth/src/
        stages: [manual]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
