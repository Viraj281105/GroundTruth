# Lets `alembic` work from the command line:
#
#   alembic -c packages/groundtruth/alembic.ini upgrade head
#   alembic -c packages/groundtruth/alembic.ini downgrade base
#
# The database URL is deliberately not set here. It comes from DATABASE_URL (or
# .env), like the rest of the configuration, so no credential is ever committed.

[alembic]
script_location = %(here)s/src/groundtruth/platform/store/migrations
