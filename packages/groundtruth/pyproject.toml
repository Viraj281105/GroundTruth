# The GroundTruth Python distribution.
#
# Shared tool configuration (ruff, mypy, pytest) lives in the repository root
# pyproject.toml so every package in the monorepo is linted identically.
# See docs/decisions/ADR-001-monorepo-structure.md.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.3.0"
description = "Independent causal verification for climate restoration and carbon-credit claims"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Viraj Jadhao" },
  { name = "Bhumi Sirvi" },
]
keywords = ["carbon-credits", "remote-sensing", "causal-inference", "redd+", "mrv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
geo = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0", "xarray>=2024.1", "rioxarray>=0.15"]
earthengine = ["earthengine-api>=0.1.390", "geemap>=0.32"]
genai = ["httpx>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "httpx>=0.27",
  "types-PyYAML",
]
all = ["groundtruth[api,geo,earthengine,genai,dev]"]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[project.urls]
Homepage = "https://github.com/Viraj281105/GroundTruth"
Repository = "https://github.com/Viraj281105/GroundTruth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundtruth = ["py.typed"]

