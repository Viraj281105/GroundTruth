# Repository-wide tooling configuration.
#
# This file is NOT a Python distribution. The distribution lives in
# packages/groundtruth/. Keeping tool config here means every package added to
# packages/ later is linted, typed and tested under the same rules.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/groundtruth/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"  # numpy stubs require 3.12+ syntax; runtime floor stays 3.11
packages = ["groundtruth"]
mypy_path = "packages/groundtruth/src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "network: requires network / external Earth-observation APIs",
  "requires_local_data(*paths): needs repo-relative data files that are not in git; skipped with the missing path named when absent",
]

[tool.coverage.run]
source = ["packages/groundtruth/src/groundtruth"]
branch = true
