[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.3.0"
description = "Independent causal verification for climate restoration and carbon-credit claims"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Viraj Jadhao" },
  { name = "Bhumi Sirvi" },
]
keywords = ["carbon-credits", "remote-sensing", "causal-inference", "redd+", "mrv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
geo = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0", "xarray>=2024.1", "rioxarray>=0.15"]
earthengine = ["earthengine-api>=0.1.390", "geemap>=0.32"]
genai = ["httpx>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "httpx>=0.27",
  "types-PyYAML",
]
all = ["groundtruth[api,geo,earthengine,genai,dev]"]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[project.urls]
Homepage = "https://github.com/Viraj281105/GroundTruth"
Repository = "https://github.com/Viraj281105/GroundTruth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundtruth = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"  # numpy stubs require 3.12+ syntax; runtime floor stays 3.11
packages = ["groundtruth"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "network: requires network / external Earth-observation APIs",
]

[tool.coverage.run]
source = ["src/groundtruth"]
branch = true
